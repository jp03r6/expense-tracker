name: Generate PNG icons

on:
  push:
    branches: [main]
    paths: [".github/workflows/generate-icons.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python .github/scripts/make_icons.py
      - name: Commit icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png icon-192.png icon-512.png icon-512-maskable.png
          git commit -m "Regenerate PNG icons [skip ci]" || echo "No icon changes"
          git push
